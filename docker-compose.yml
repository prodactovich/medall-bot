services:
  bot:
    build: .
    container_name: medall-bot
    env_file:
      - .env
    environment:
      INTRO_VIDEO_PATH: /app/cats_videos.mp4
      DATABASE_URL: sqlite:////data/medall.db
    # Храним SQLite отдельно от кода приложения
    volumes:
      - sqlite_data:/data
      - ./cats_videos.mp4:/app/cats_videos.mp4:ro
    restart: unless-stopped

volumes:
  sqlite_data:
