[tool.black]
line-length = 79
target-version = ["py311", "py312"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I"]  # Extra rules: B bugbear, I import sorting (isort)
ignore = ["E501"]
